{{- if and .Values.kyvernoPolicyExceptions.enabled .Values.kyvernoPolicyExceptions.legacy.enabled }}
{{- if .Values.bootstrapMode.enabled }}
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: {{ include "resource.default.name" . }}-bootstrap-mode
  namespace: kube-system
  labels:
    {{- include "labels.common" . | nindent 4 }}
    policy.giantswarm.io/migrated-to-cel: "true"
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
spec:
  exceptions:
    - policyName: disallow-host-namespaces
      ruleNames:
        - autogen-host-namespaces
        - host-namespaces
  match:
    any:
    - resources:
        kinds:
          - Deployment
          - ReplicaSet
          - Pod
        namespaces:
          - {{ include "resource.default.namespace" . }}
        names:
          - "{{ include "resource.default.name" . }}*"
{{- end -}}
{{- end -}}
